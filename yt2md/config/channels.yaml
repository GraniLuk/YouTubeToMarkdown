# LLM Strategy Configuration
llm_strategies:
  default:
    # Model definitions - change models here only
    model_configs:
      gemini:
        primary_model:  "gemini-3.6-flash"
        fallback_model: "gemini-3.5-flash"
        thinking_level: "none"  # Disabled: thinking_config not supported by API
      ollama:
        model_name: "gemma4:26b"
        base_url: "http://localhost:11434"
      openrouter:
        # model_name sourced from OPENROUTER_MODEL env var (see .env)
        base_url: "https://openrouter.ai/api/v1/chat/completions"
    
    # Strategy for selecting models based on transcript length
    strategy_by_length:
      short:  # Controlled by LLM_SHORT_MAX_WORDS
        primary: 
          provider: "ollama"
        fallback:
          provider: "gemini"
          model_type: "primary"
      medium: # Controlled by LLM_MEDIUM_MAX_WORDS
        primary:
          provider: "gemini"
          model_type: "primary"
        fallback:
          provider: "gemini"
          model_type: "fallback"
      long:   # Above LLM_MEDIUM_MAX_WORDS
        primary:
          provider: "gemini"
          model_type: "primary"
        fallback:
          provider: "openrouter"
      
  # Category-specific overrides
  IT:
    strategy_by_length:
      short:
        primary:
          provider: "ollama"
        fallback:
          provider: "gemini"
          model_type: "primary"
      medium:
        primary:
          provider: "gemini"
          model_type: "primary"
        fallback:
          provider: "gemini"
          model_type: "fallback"
      long:
        primary:
          provider: "gemini"
          model_type: "primary"
        fallback:
          provider: "openrouter"

